<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wizard footer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --font-sans: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    --bg: #0b0b0c;
    --bg-pill: #161618;
    --bg-pill-strong: #1d1d20;
    --border: #2e2e33;
    --border-strong: #3d3d43;
    --text: #e7e7e8;
    --text-muted: #8b8b8f;
    --text-faint: #5a5a5e;
    --accent: #e97237;
    --accent-strong: #f08043;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #0D0D0D;
    color: var(--text);
    font-family: var(--font-sans);
    font-weight: 400;
    font-size: 12pt;
    line-height: 1.45;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  /* ===== Wizard footer (mirrors .wizard-footer in src/index.css) ===== */
  .wizard-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 72px;
    padding: 16px 40px;
    border-top: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }

  .wizard-footer-left { display: flex; align-items: center; gap: 18px; }

  .wizard-saved {
    font-family: var(--font-sans);
    font-size: 12pt;
    font-weight: 400;
    color: var(--text-muted);
  }

  .wizard-cancel {
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: var(--font-sans);
    font-size: 12pt;
    font-weight: 600;
    color: var(--text);
    padding: 4px 8px;
  }
  .wizard-cancel:hover { color: #fff; }

  .wizard-actions { display: flex; gap: 10px; }

  .btn-save-draft {
    padding: 9px 18px;
    background: transparent;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 12pt;
    font-weight: 600;
    cursor: pointer;
    width: auto;
    white-space: nowrap;
  }
  .btn-save-draft:hover { background: var(--bg-pill); }

  /* Primary action is accent-orange inside a wizard */
  .btn-publish {
    padding: 9px 18px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-family: var(--font-sans);
    font-size: 12pt;
    font-weight: 600;
    cursor: pointer;
    width: auto;
    white-space: nowrap;
  }
  .btn-publish:hover { background: var(--accent-strong); }
</style>
</head>
<body>
  <footer class="wizard-footer">
    <div class="wizard-footer-left">
      <button class="wizard-cancel" type="button">Cancel</button>
    </div>
    <div class="wizard-actions">
      <button class="btn-save-draft" type="button">Save as draft</button>
      <button class="btn-publish" type="button">Publish</button>
    </div>
  </footer>
</body>
</html>
